name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.5.0
  FE_SHA256: 3732fbe8a6e9d2ea3925d02d0e3a1478bc1e01d742c2be75d3ea7300c46c45f0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Fe release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/argotorg/fe/releases/download/${FE_VERSION}/fe_linux_amd64"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 -o /tmp/fe "$url"
          printf '%s  %s\n' "$FE_SHA256" /tmp/fe | sha256sum -c -
          install -m 0755 /tmp/fe "$RUNNER_TEMP/fe"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe fmt --check tests/evm-probes
      - run: fe fmt --check tests/stateful-runner
      - run: fe check . --profile dev
      - run: fe check tests/evm-probes --profile dev
      - run: fe check tests/stateful-runner --profile dev
      - name: Verify root ingot emits no deployable contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/root-build"
          mkdir -p "$out"
          set +e
          output="$(fe build . --profile dev --out-dir "$out" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ] || ! grep -Fq "Error: No contracts found to build" <<<"$output"; then
            echo "root ingot did not report the expected no-contract boundary" >&2
            exit 1
          fi
          if find "$out" -type f -print -quit | grep -q .; then
            echo "root ingot unexpectedly emitted build artifacts" >&2
            find "$out" -type f -print >&2
            exit 1
          fi
      - run: fe test . --backend sonatina --profile test -O 1 --jobs 1
      - run: fe test tests/evm-probes --backend sonatina --profile test -O 1 --jobs 1
      - run: fe test tests/stateful-runner --backend sonatina --profile test -O 1 --jobs 1
      - name: Verify independent Keccak oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oracle"
          "$RUNNER_TEMP/oracle/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/requirements-oracle-ci.txt
          "$RUNNER_TEMP/oracle/bin/python" tools/oracle_vectors.py
